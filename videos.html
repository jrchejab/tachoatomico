<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACHOATOMICO — videos</title>
<style>
@font-face {
  font-family: 'Moonline Solid';
  src: url('fonts/Moonlite Solid.otf') format('opentype');
}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #fff;
  color: #1c1c1c;
  line-height: 1.6;
}
.container { width: 90%; max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

/* top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 3rem;
}
.inicio-link {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 1.4rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #333;
  text-decoration: none;
}
.logo-group {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
}
.logo-group img { display: block; margin: 0 auto; height: 100px; }
.logo-group h1 {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 1.8rem;
  font-weight: 400;
  letter-spacing: 2px;
  color: #111;
  margin: 0;
  text-align: center;
  white-space: nowrap;
}
.logo-group nav {
  display: flex;
  flex-direction: column;
  padding: 0;
  margin-top: -5px;
}
.logo-group nav .nav-principal {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  width: 100%;
}
.logo-group nav > a {
  align-self: flex-start;
  margin-top: 0;
}

nav a {
  position: relative;
  display: inline-block;
  color: #333;
  text-decoration: none;
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-weight: 400;
  font-size: 1.4rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}
nav a .dot {
  position: absolute;
  width: 9px;
  height: 9px;
  background: url('imagenes/atom.png') no-repeat center/contain;
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* contenido */
.content-grid {
  display: grid;
  grid-template-columns: 30% 70%;
  gap: 0;
  column-gap: 2rem;
}
.section-title {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 10rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #111;
  line-height: 0.85;
}
#videos-content { font-family: 'Roboto', sans-serif; }

.obra-videos {
  margin-bottom: 2.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #e0e0e0;
}
.obra-videos:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.obra-videos .video-titulo {
  font-size: 1.1rem;
  font-weight: 400;
  color: #111;
  margin-bottom: 0.75rem;
}
.obra-videos .video-complemento {
  font-size: 0.85rem;
  color: #c00080;
  font-weight: 400;
  margin-bottom: 1rem;
}
.obra-videos video {
  width: 100%;
  max-width: 640px;
  display: block;
  border-radius: 6px;
  margin-bottom: 0.75rem;
}
.video-link { margin-bottom: 0.35rem; }
.video-link a { color: #c00080; text-decoration: underline; font-size: 0.95rem; }

footer { text-align: center; padding: 2rem 0; font-size: 0.8rem; color: #bbb; }
</style>
</head>
<body>

<div class="container">

  <div id="inner-header"></div>

  <section>
    <div class="content-grid">
      <div class="section-title">VIDEOS</div>
      <div id="videos-content"></div>
    </div>
  </section>

  <footer>
    @tachoatomico · 2026
  </footer>

</div>

<script src="content.js"></script>
<script src="components.js"></script>
<script>
renderInnerHeader('inner-header');
var el = document.getElementById('videos-content');
CONTENIDO.obras.forEach(function(o) {
  if (!o.videos || !o.videos.length) return;
  var html = '<div class="obra-videos">' +
    '<div class="video-titulo">' + o.titulo + '</div>' +
    (o.complemento_titulo ? '<div class="video-complemento">' + o.complemento_titulo + '</div>' : '');
  o.videos.forEach(function(v) {
    html += '<video controls preload="metadata"><source src="' + v + '" type="video/mp4"></video>';
  });
  html += '</div>';
  el.innerHTML += html;
});
agregarPuntos('#nav-menu a', 16);
absolutizarLinks();
</script>
</body>
</html>
