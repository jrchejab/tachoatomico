<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACHOATOMICO — arte</title>
<style>
@font-face {
  font-family: 'Moonline Solid';
  src: url('fonts/Moonlite Solid.otf') format('opentype');
}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #fff;
  color: #1c1c1c;
  line-height: 1.6;
}
.container { width: 90%; max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

/* top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 3rem;
}
.inicio-link {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 1.4rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #333;
  text-decoration: none;
}
.logo-group {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
}
.logo-group img { display: block; margin: 0 auto; height: 100px; }
.logo-group h1 {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 1.8rem;
  font-weight: 400;
  letter-spacing: 2px;
  color: #111;
  margin: 0;
  text-align: center;
  white-space: nowrap;
}
.logo-group nav {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  padding: 0;
  margin-top: -5px;
}

nav a {
  position: relative;
  display: inline-block;
  color: #333;
  text-decoration: none;
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-weight: 400;
  font-size: 1.4rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}
nav a .dot {
  position: absolute;
  width: 9px;
  height: 9px;
  background: url('imagenes/atom.png') no-repeat center/contain;
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* contenido */
.content-grid {
  display: grid;
  grid-template-columns: 30% 70%;
  gap: 0;
  column-gap: 2rem;
}
.section-title {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 10rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #111;
  line-height: 0.85;
}
#arte-content { font-family: 'Roboto', sans-serif; }

.obra { margin-bottom: 3rem; }
.obra:last-child { margin-bottom: 0; }

.obra-encabezado { margin-bottom: 1rem; }
.obra-titulo { font-size: 1.1rem; font-weight: 400; color: #111; }
.obra-complemento { font-size: 0.85rem; color: #c00080; font-weight: 400; margin-top: 0.15rem; }
.obra-exposicion { font-size: 0.85rem; color: #111; font-weight: 400; margin-top: 0.15rem; }
.obra-año { font-size: 0.85rem; color: #111; font-weight: 400; margin-top: 0.15rem; }

.obra-descripcion { font-size: 1rem; font-weight: 300; color: #555; text-align: justify; line-height: 1.6; }
.obra-extra { font-size: 1rem; font-weight: 300; color: #555; text-align: justify; margin-top: 0.5rem; }

.obra-multimedia { margin-top: 1rem; }
.obra-multimedia img { width: 100%; border-radius: 6px; }
.obra-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1rem; align-items: end; }
.obra-grid img { width: 100%; border-radius: 6px; }

.obra-links { margin-top: 0.75rem; }
.obra-links a { color: #c00080; text-decoration: underline; font-size: 0.9rem; display: inline-block; margin-right: 1rem; }

/* partes de una obra */
.obra-partes { margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.obra-parte {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  align-items: center;
}
.obra-parte-texto {
  font-size: 0.95rem;
  font-weight: 300;
  color: #555;
  text-align: justify;
  line-height: 1.6;
}
.obra-parte-texto strong { font-weight: 400; color: #111; }
.obra-parte-img { min-width: 0; }
.obra-parte-img img { width: 100%; max-width: 100%; height: auto; border-radius: 6px; }

footer { text-align: center; padding: 2rem 0; font-size: 0.8rem; color: #bbb; }

/* grupos de obras */
.grupo-arte { margin-bottom: 3rem; }
.grupo-arte:last-child { margin-bottom: 0; }
.grupo-titulo {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: 2px;
  color: #111;
  line-height: 1;
  margin-bottom: 1rem;
  border-bottom: 1px solid #e0e0e0;
  padding-bottom: 0.5rem;
}
.grupo-obras { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
.grupo-obras .obra { margin-bottom: 0; }
.grupo-texto {
  font-family: 'Roboto', sans-serif;
  font-size: 0.95rem;
  font-weight: 300;
  color: #555;
  text-align: justify;
  line-height: 1.6;
  margin-bottom: 1.25rem;
  max-width: 800px;
}
</style>
</head>
<body>

<div class="container">

  <div id="inner-header"></div>

  <section>
    <div class="content-grid">
      <div class="section-title">ARTE</div>
      <div id="arte-content"></div>
    </div>
  </section>

  <footer>
    @tachoatomico · 2025
  </footer>

</div>

<script src="content.js"></script>
<script src="components.js"></script>
<script>
renderInnerHeader('inner-header');
renderObrasAgrupadas('arte-content');
agregarPuntos('#nav-menu a', 16);
</script>
</body>
</html>
