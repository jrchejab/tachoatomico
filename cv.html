<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACHOATOMICO — Hoja de Vida</title>
<style>
@font-face {
  font-family: 'Moonline Solid';
  src: url('fonts/Moonlite Solid.otf') format('opentype');
}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #fff;
  color: #1c1c1c;
  line-height: 1.6;
}
.container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

header {
  text-align: center;
  padding: 3rem 0 1.5rem;
  border-bottom: 1px solid #d4d4d4;
}
header img { height: 200px; margin-bottom: 0.75rem; }
header h1 {
  font-family: 'Moonline Solid', 'Inter', sans-serif;
  font-size: 3.5rem;
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #111;
  margin-bottom: 0;
}
header .tagline, header .meta-tags {
  color: #ff0066;
  font-family: 'Courier New', Courier, monospace;
  font-weight: 400;
}
header .tagline { font-size: 1.7rem; margin-top: 0; margin-bottom: 2px; line-height: 1.2; }
header .meta-tags { font-size: 1.7rem; line-height: 1.2; }

section { padding: 2.5rem 0; border-bottom: 1px solid #e0e0e0; }
section:last-of-type { border-bottom: none; }
h2 { font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: #999; margin-bottom: 1.25rem; }

.contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.contact-item { background: #f5f5f5; padding: 1rem 1.25rem; border-radius: 8px; border: 1px solid #e0e0e0; }
.contact-item .label { font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 1px; }
.contact-item .value { font-size: 1rem; color: #333; margin-top: 0.25rem; }

.profile-text { font-size: 1rem; color: #555; }
#bio-index .profile-text { text-align: justify; }

.timeline { display: flex; flex-direction: column; gap: 1rem; }
.timeline-item {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 1.5rem;
  padding: 1rem 1.25rem;
  background: #f5f5f5;
  border-radius: 8px;
  border: 1px solid #e0e0e0;
}
.timeline-item .year { font-weight: 600; color: #999; font-size: 0.9rem; }
.timeline-item .role { font-weight: 600; color: #111; }
.timeline-item .place { font-size: 0.85rem; color: #888; margin-top: 0.15rem; }
.timeline-item .desc { font-size: 0.9rem; color: #777; margin-top: 0.4rem; }

.proyecto { background: #f5f5f5; border-radius: 8px; border: 1px solid #e0e0e0; padding: 1.5rem; margin-bottom: 1.25rem; }
.proyecto:last-child { margin-bottom: 0; }
.proyecto h3 { font-size: 1.15rem; font-weight: 600; color: #111; }
.proyecto .sub { font-size: 0.8rem; color: #999; margin-top: 0.2rem; }
.proyecto p { font-size: 0.95rem; color: #555; margin-top: 0.75rem; }

.expo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
@media (max-width: 640px) { .expo-grid { grid-template-columns: 1fr; } }
.expo-card { background: #f5f5f5; border-radius: 8px; border: 1px solid #e0e0e0; padding: 1.5rem; }
.expo-card h3 { font-size: 1rem; font-weight: 600; color: #111; }
.expo-card .meta { font-size: 0.8rem; color: #999; margin-top: 0.3rem; }
.expo-card p { font-size: 0.9rem; color: #555; margin-top: 0.6rem; }

.skills { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.skill-tag { background: #f0f0f0; border: 1px solid #ddd; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; color: #555; }

footer { text-align: center; padding: 2rem 0; font-size: 0.8rem; color: #bbb; }
a { color: #666; text-decoration: none; }
a:hover { color: #111; }

@media print {
  @page { size: letter; margin: 1.2cm; }
  html { zoom: 0.8; }
  .inicio-pagina {
    break-before: page;
    page-break-before: always;
  }
}
</style>
</head>
<body>

<div class="container">

  <div id="main-header"></div>

  <section>
    <h2>Biografía</h2>
    <div id="bio-index"></div>
  </section>

  <section>
    <h2>Contacto</h2>
    <div class="contact-grid">
      <div class="contact-item">
        <div class="label">Nombre</div>
        <div class="value">José Ricardo Moreno Chejab</div>
      </div>
      <div class="contact-item">
        <div class="label">Ubicación</div>
        <div class="value">Bogotá, Colombia</div>
      </div>
      <div class="contact-item">
        <div class="label">Móvil</div>
        <div class="value"><a href="tel:+573208366443">320 836 6443</a></div>
      </div>
      <div class="contact-item">
        <div class="label">Email</div>
        <div class="value"><a href="mailto:jrchejab@gmail.com">jrchejab@gmail.com</a></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Perfil</h2>
    <p class="profile-text" id="perfil-text"></p>
  </section>

  <section>
    <h2>Perfil Académico</h2>
    <div id="academico"></div>
  </section>

  <section class="inicio-pagina">
    <h2>Arte</h2>
    <div id="arte-trayectoria"></div>
  </section>

  <section>
    <h2>Trayectoria Laboral</h2>
    <div id="laboral"></div>
  </section>

  <section>
    <h2>Idiomas</h2>
    <div class="skills">
      <span class="skill-tag">Inglés — Fluido (escritura, lectura, comprensión)</span>
    </div>
  </section>

  <footer>@TACHOATOMICO — 2025</footer>

</div>

<script src="content.js"></script>
<script src="components.js"></script>
<script>
renderMainHeader('main-header');

var bioEl = document.getElementById('bio-index');
CONTENIDO.bio.forEach(function(t, i) {
  var p = document.createElement('p');
  p.className = 'profile-text';
  if (i > 0) p.style.marginTop = '1rem';
  p.textContent = t;
  bioEl.appendChild(p);
});

document.getElementById('perfil-text').textContent = CONTENIDO.perfil;
document.getElementById('academico').innerHTML = timelineHTML(CONTENIDO.academico);
document.getElementById('arte-trayectoria').innerHTML = timelineHTML(CONTENIDO.arte_trayectoria);
document.getElementById('laboral').innerHTML = timelineHTML(CONTENIDO.laboral);
absolutizarLinks();
</script>
</body>
</html>
